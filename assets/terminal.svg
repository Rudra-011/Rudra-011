<svg width="1200" height="580" viewBox="0 0 1200 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="580">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminalClip">
      <rect x="31" y="31" width="1138" height="518" rx="17"/>
    </clipPath>

    <style>
      .mono {
        font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
      }

      .cursor {
        animation: blink 0.85s steps(2, start) infinite;
      }

      .scanline {
        animation: scan 5s linear infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .fade1 {
        animation: fade1 8s infinite;
      }

      .fade2 {
        animation: fade2 8s infinite;
      }

      .fade3 {
        animation: fade3 8s infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      @keyframes scan {
        0% { transform: translateY(-80px); opacity: 0; }
        20% { opacity: 0.22; }
        80% { opacity: 0.16; }
        100% { transform: translateY(600px); opacity: 0; }
      }

      @keyframes fade1 {
        0%, 10% { opacity: 0; }
        18%, 100% { opacity: 1; }
      }

      @keyframes fade2 {
        0%, 30% { opacity: 0; }
        38%, 100% { opacity: 1; }
      }

      @keyframes fade3 {
        0%, 50% { opacity: 0; }
        58%, 100% { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="30" y="30" width="1140" height="520" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>

  <path d="M48 30H1152C1161.94 30 1170 38.06 1170 48V86H30V48C30 38.06 38.06 30 48 30Z" fill="#161b22"/>
  <line x1="30" y1="86" x2="1170" y2="86" stroke="#30363d" stroke-width="2"/>

  <circle cx="61" cy="58" r="8" fill="#ff5f57"/>
  <circle cx="87" cy="58" r="8" fill="#febc2e"/>
  <circle cx="113" cy="58" r="8" fill="#28c840"/>

  <text x="600" y="64" fill="#8b949e" text-anchor="middle" font-size="15" class="mono">
    rudra@github — zsh — 120×34
  </text>

  <line x1="485" y1="112" x2="485" y2="519" stroke="#30363d" stroke-dasharray="5 6"/>

  <text x="67" y="125" fill="#00ff99" font-size="16" font-weight="700" class="mono" filter="url(#glow)">
    root@rudra:~$ ./identity_scan
  </text>

  <g class="mono" font-size="13" fill="#8b5cf6" filter="url(#glow)">
    <text x="105" y="170">                 .-""""-.</text>
    <text x="105" y="190">                /  _  _  \</text>
    <text x="105" y="210">               |  / \/ \  |</text>
    <text x="105" y="230">               |  \_/\_/  |</text>
    <text x="105" y="250">               |   ____   |</text>
    <text x="105" y="270">                \  \__/  /</text>
    <text x="105" y="290">             ____'.____.'____</text>
    <text x="105" y="310">           .'    /|    |\    '.</text>
    <text x="105" y="330">          /     / |    | \     \</text>
    <text x="105" y="350">         /_____/  |____|  \_____\</text>
    <text x="105" y="370">         |     |  /    \  |     |</text>
    <text x="105" y="390">         |  AI | / DATA \ | ML  |</text>
    <text x="105" y="410">         |_____|/________\|_____|</text>
  </g>

  <circle cx="134" cy="462" r="5" fill="#00ff99" class="pulse" filter="url(#glow)"/>
  <text x="151" y="468" fill="#00ff99" font-size="15" font-weight="700" class="mono">ACCESS GRANTED</text>
  <text x="132" y="498" fill="#8b949e" font-size="13" class="mono">Identity verified successfully.</text>

  <text x="525" y="126" fill="#c9d1d9" font-size="15" class="mono">rudra@github:~$ cat profile.yaml</text>

  <g class="mono" font-size="16">
    <g class="fade1">
      <text x="525" y="170" fill="#7c3aed">name:</text>
      <text x="680" y="170" fill="#ffffff">Rudra Bhuyan</text>

      <text x="525" y="200" fill="#7c3aed">role:</text>
      <text x="680" y="200" fill="#00ff99">AI &amp; Machine Learning Developer</text>

      <text x="525" y="230" fill="#7c3aed">education:</text>
      <text x="680" y="230" fill="#c9d1d9">B.Tech Computer Science</text>
    </g>

    <g class="fade2">
      <text x="525" y="278" fill="#7c3aed">focus:</text>
      <text x="680" y="278" fill="#c9d1d9">Computer Vision</text>
      <text x="680" y="307" fill="#c9d1d9">Deep Learning</text>
      <text x="680" y="336" fill="#c9d1d9">Multimodal AI</text>
    </g>

    <g class="fade3">
      <text x="525" y="382" fill="#7c3aed">stack:</text>
      <text x="680" y="382" fill="#facc15">Python · PyTorch · OpenCV</text>

      <text x="525" y="414" fill="#7c3aed">status:</text>
      <text x="680" y="414" fill="#00ff99">Training new ideas...</text>

      <text x="525" y="446" fill="#7c3aed">mission:</text>
      <text x="680" y="446" fill="#c9d1d9">Build reliable intelligent systems</text>
    </g>
  </g>

  <text x="525" y="494" fill="#00ff99" font-size="15" class="mono">rudra@github:~$</text>
  <rect x="681" y="480" width="10" height="18" rx="1" fill="#00ff99" class="cursor"/>

  <g clip-path="url(#terminalClip)">
    <rect x="31" y="90" width="1138" height="42" fill="#00ff99" opacity="0.10" class="scanline"/>
  </g>

  <text x="1110" y="530" text-anchor="end" fill="#6e7681" font-size="12" class="mono">
    encrypted connection · online
  </text>
</svg>
